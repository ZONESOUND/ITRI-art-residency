[project]
name = "soundtools"
version = "0.1.0"
description = "離線聲音工具：varispeed 漂移、磁帶效果、拼貼、樂句與音節分析（來自《節奏繞纏》）"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "librosa>=0.10",
  "pyloudnorm>=0.1.1",
]

[project.optional-dependencies]
phones = ["allosaurus>=1.0"]
plot = ["matplotlib>=3.8"]

[project.scripts]
soundtools = "soundtools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soundtools"]
